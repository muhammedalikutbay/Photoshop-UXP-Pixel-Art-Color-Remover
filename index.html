<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Art Color Remover</title>
    <link rel="stylesheet" href="src/ui/styles.css" />
  </head>
  <body>
    <main class="panel">
      <div class="panel-content">
        <section class="section colors-section" aria-labelledby="colors-heading">
          <div class="section-heading">
            <h1 id="colors-heading">Colors</h1>
            <span id="color-count" class="muted">0</span>
          </div>
          <div id="color-list" class="color-list" aria-live="polite"></div>

          <form id="color-form" class="add-color-form">
            <label for="hex-input">HEX</label>
            <div class="hex-container">
              <input id="hex-input" name="hex" type="text" placeholder="#FF00FF" maxlength="7" autocomplete="off" />
              <button id="eyedropper-button" class="icon-action" type="button" title="Choose color" aria-label="Choose color">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="m14.7 4.3 5 5-2.1 2.1-1.2-1.2-7.9 7.9H5.2v-3.3l7.9-7.9-1.2-1.2 2.8-2.8Zm-7.9 12.5v.3h.3l7.9-7.9-.3-.3-7.9 7.9ZM4 21h16" />
                </svg>
              </button>
              <input id="color-picker" class="color-picker" type="color" value="#FF00FF" aria-label="Choose a color" />
              <button class="add-button" type="submit">Add color</button>
            </div>
          </form>
        </section>

        <section class="section settings-section" aria-labelledby="settings-heading">
          <h1 id="settings-heading">Settings</h1>
          <label class="field" for="tolerance-input">
            <span>Tolerance</span>
            <input id="tolerance-input" type="number" min="0" max="255" step="1" value="0" />
          </label>

          <fieldset>
            <legend>Target</legend>
            <label class="radio-row"><input type="radio" name="target" value="active-layer" checked /><span class="radio-box" aria-hidden="true"></span><span>Active Layer</span></label>
            <label class="radio-row"><input type="radio" name="target" value="visible-layers" /><span class="radio-box" aria-hidden="true"></span><span>All Visible Layers</span></label>
            <p class="hint">Visible pixel layers are processed. Adjustment, text, and smart-object layers are skipped.</p>
          </fieldset>
        </section>
      </div>

      <section class="actions">
        <button id="select-button" class="secondary" type="button" disabled>Select</button>
        <button id="delete-button" class="primary" type="button" disabled>Select &amp; Delete</button>
      </section>

      <p id="status" class="status" role="status">Ready. Add one or more colors to begin.</p>
    </main>
    <script src="dist/main.js"></script>
  </body>
</html>
